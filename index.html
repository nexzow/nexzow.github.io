<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surpresa para Você! 🎁</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #ffe4e1; margin: 0; font-family: sans-serif; overflow: hidden; }
        .box { width: 150px; height: 150px; background: #ff4757; position: relative; cursor: pointer; transition: transform 0.5s; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .box::before { content: ''; position: absolute; left: 65px; width: 20px; height: 100%; background: #ffd32a; }
        .box::after { content: ''; position: absolute; top: 65px; width: 100%; height: 20px; background: #ffd32a; }
        .lid { position: absolute; top: -20px; left: -10px; width: 170px; height: 30px; background: #ff6b81; border-radius: 5px; transition: transform 0.5s; }
        .lid::before { content: ''; position: absolute; left: 75px; width: 20px; height: 100%; background: #ffd32a; }
        .reveal { display: none; text-align: center; animation: fadeIn 1s; }
        .product-img { max-width: 250px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-top: 15px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="box" id="giftBox" onclick="unwrap()">
        <div class="lid" id="giftLid"></div>
    </div>

    <div class="reveal" id="surprise">
        <h2>Seu presente está a caminho! 🥳</h2>
        <p>Não aguentei esperar o entregador chegar, olha o que comprei para você:</p>
        <!-- Troque a URL abaixo pela foto do produto real -->
        <img class="product-img" src="https://placeholder.com" alt="Seu Presente">
    </div>

    <script>
        function unwrap() {
            document.getElementById('giftLid').style.transform = 'translateY(-100px) rotate(20deg)';
            document.getElementById('giftBox').style.transform = 'scale(0)';
            setTimeout(() => {
                document.getElementById('giftBox').style.display = 'none';
                document.getElementById('surprise').style.display = 'block';
            }, 400);
        }
    </script>
</body>
</html>
